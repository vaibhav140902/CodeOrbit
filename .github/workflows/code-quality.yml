name: Code Quality

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/code-quality.yml"
      - "apps/**"
      - "package-lock.json"
      - "package.json"
      - "packages/**"
      - "tsconfig.base.json"
      - "turbo.json"
      - "frontend/**"
      - "backend/functions/**"
  push:
    branches:
      - main
    paths:
      - ".github/scripts/**"
      - ".github/workflows/code-quality.yml"
      - "apps/**"
      - "package-lock.json"
      - "package.json"
      - "packages/**"
      - "tsconfig.base.json"
      - "turbo.json"
      - "frontend/**"
      - "backend/functions/**"

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tracked files for secrets and generated artifacts
        run: bash .github/scripts/repo-hygiene.sh

  workspace-web:
    name: Workspace web lint, typecheck, and build
    if: ${{ hashFiles('package.json') != '' && hashFiles('package-lock.json') != '' && hashFiles('apps/web/package.json') != '' }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://codeorbit.app
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-demo-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-demo.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-demo-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-demo.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:abcdef123456"
      NEXT_PUBLIC_FIREBASE_FUNCTIONS_REGION: asia-south2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Lint workspace web app
        run: npm run lint:web

      - name: Typecheck workspace web app
        run: npm run typecheck:web

      - name: Build workspace web app
        run: npm run build:web

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_FIREBASE_API_KEY: ci-demo-api-key
      VITE_FIREBASE_AUTH_DOMAIN: ci-demo.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-demo-project
      VITE_FIREBASE_STORAGE_BUCKET: ci-demo.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
      VITE_FIREBASE_APP_ID: "1:1234567890:web:abcdef123456"
      VITE_FIREBASE_FUNCTIONS_REGION: asia-south2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  functions:
    name: Functions lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci

      - name: Lint functions
        run: npm run lint

      - name: Build functions
        run: npm run build

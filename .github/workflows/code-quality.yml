name: Code Quality

on:
  pull_request:
    paths:
      - ".github/workflows/code-quality.yml"
      - "frontend/**"
      - "backend/functions/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/code-quality.yml"
      - "frontend/**"
      - "backend/functions/**"

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_FIREBASE_API_KEY: ci-demo-api-key
      VITE_FIREBASE_AUTH_DOMAIN: ci-demo.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-demo-project
      VITE_FIREBASE_STORAGE_BUCKET: ci-demo.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
      VITE_FIREBASE_APP_ID: "1:1234567890:web:abcdef123456"
      VITE_FIREBASE_FUNCTIONS_REGION: asia-south2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  functions:
    name: Functions lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Install functions dependencies
        run: npm ci

      - name: Lint functions
        run: npm run lint

      - name: Build functions
        run: npm run build
